<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑神话 - 牛来 功能测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #F8FAFC;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #F59E0B;
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
        }
        
        .test-section {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-section h2 {
            color: #38BDF8;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #1E293B;
        }
        
        .test-item:last-child {
            border-bottom: none;
        }
        
        .test-label {
            flex: 1;
        }
        
        .test-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-pass {
            background: #10B981;
            color: white;
        }
        
        .status-fail {
            background: #EF4444;
            color: white;
        }
        
        .status-pending {
            background: #F59E0B;
            color: white;
        }
        
        .test-button {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        .test-button:hover {
            transform: translateY(-2px);
        }
        
        .test-button:active {
            transform: translateY(0);
        }
        
        .button-group {
            text-align: center;
            margin-top: 20px;
        }
        
        .log-output {
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 15px;
        }
        
        .log-entry {
            margin-bottom: 5px;
        }
        
        .log-success {
            color: #10B981;
        }
        
        .log-error {
            color: #EF4444;
        }
        
        .log-info {
            color: #38BDF8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐂 黑神话 - 牛来 功能测试</h1>
        
        <div class="test-section">
            <h2>📦 文件加载测试</h2>
            <div class="test-item">
                <div class="test-label">index.html 加载</div>
                <div class="test-status status-pass" id="test-html">✓ 通过</div>
            </div>
            <div class="test-item">
                <div class="test-label">game.js 模块</div>
                <div class="test-status status-pending" id="test-gamejs">⏳ 检测中</div>
            </div>
            <div class="test-item">
                <div class="test-label">debug.js 模块</div>
                <div class="test-status status-pending" id="test-debugjs">⏳ 检测中</div>
            </div>
            <div class="test-item">
                <div class="test-label">Three.js 库</div>
                <div class="test-status status-pending" id="test-threejs">⏳ 检测中</div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🎮 游戏系统测试</h2>
            <div class="test-item">
                <div class="test-label">玩家角色系统</div>
                <div class="test-status status-pending" id="test-player">⏳ 待测试</div>
            </div>
            <div class="test-item">
                <div class="test-label">敌人AI系统</div>
                <div class="test-status status-pending" id="test-enemy">⏳ 待测试</div>
            </div>
            <div class="test-item">
                <div class="test-label">战斗系统</div>
                <div class="test-status status-pending" id="test-combat">⏳ 待测试</div>
            </div>
            <div class="test-item">
                <div class="test-label">技能系统</div>
                <div class="test-status status-pending" id="test-skill">⏳ 待测试</div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🎨 渲染测试</h2>
            <div class="test-item">
                <div class="test-label">3D 场景创建</div>
                <div class="test-status status-pending" id="test-scene">⏳ 待测试</div>
            </div>
            <div class="test-item">
                <div class="test-label">光照系统</div>
                <div class="test-status status-pending" id="test-lighting">⏳ 待测试</div>
            </div>
            <div class="test-item">
                <div class="test-label">粒子特效</div>
                <div class="test-status status-pending" id="test-particles">⏳ 待测试</div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="test-button" onclick="runAllTests()">🚀 运行所有测试</button>
            <button class="test-button" onclick="window.location.href='index.html'">▶️ 启动游戏</button>
            <button class="test-button" onclick="clearLogs()">🗑️ 清空日志</button>
        </div>
        
        <div class="test-section">
            <h2>📋 测试日志</h2>
            <div class="log-output" id="logOutput">
                <div class="log-entry log-info">[INFO] 测试系统已就绪</div>
            </div>
        </div>
    </div>
    
    <script>
        function log(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logOutput.appendChild(entry);
            logOutput.scrollTop = logOutput.scrollHeight;
        }
        
        function setStatus(id, status) {
            const element = document.getElementById(id);
            element.className = `test-status status-${status}`;
            element.textContent = status === 'pass' ? '✓ 通过' : 
                                  status === 'fail' ? '✗ 失败' : '⏳ 检测中';
        }
        
        function clearLogs() {
            document.getElementById('logOutput').innerHTML = 
                '<div class="log-entry log-info">[INFO] 日志已清空</div>';
        }
        
        async function testFileLoading() {
            log('开始文件加载测试...', 'info');
            
            // 测试 game.js
            try {
                const response = await fetch('/game.js');
                if (response.ok) {
                    const content = await response.text();
                    if (content.includes('class Game') && content.includes('class NiuLai')) {
                        setStatus('test-gamejs', 'pass');
                        log('game.js 加载成功，包含所有必要类', 'success');
                    } else {
                        setStatus('test-gamejs', 'fail');
                        log('game.js 内容不完整', 'error');
                    }
                }
            } catch (e) {
                setStatus('test-gamejs', 'fail');
                log(`game.js 加载失败: ${e.message}`, 'error');
            }
            
            // 测试 debug.js
            try {
                const response = await fetch('/debug.js');
                if (response.ok) {
                    setStatus('test-debugjs', 'pass');
                    log('debug.js 加载成功', 'success');
                } else {
                    setStatus('test-debugjs', 'fail');
                    log('debug.js 加载失败', 'error');
                }
            } catch (e) {
                setStatus('test-debugjs', 'fail');
                log(`debug.js 加载失败: ${e.message}`, 'error');
            }
            
            // 测试 Three.js
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
                if (response.ok) {
                    setStatus('test-threejs', 'pass');
                    log('Three.js CDN 连接正常', 'success');
                } else {
                    setStatus('test-threejs', 'fail');
                    log('Three.js CDN 连接失败', 'error');
                }
            } catch (e) {
                setStatus('test-threejs', 'fail');
                log(`Three.js 加载失败: ${e.message}`, 'error');
            }
        }
        
        async function testGameSystems() {
            log('开始游戏系统测试...', 'info');
            
            try {
                const response = await fetch('/game.js');
                const content = await response.text();
                
                // 测试玩家系统
                if (content.includes('class NiuLai') && 
                    content.includes('performLightAttack') &&
                    content.includes('performHeavyAttack')) {
                    setStatus('test-player', 'pass');
                    log('玩家角色系统验证通过', 'success');
                } else {
                    setStatus('test-player', 'fail');
                    log('玩家角色系统不完整', 'error');
                }
                
                // 测试敌人系统
                if (content.includes('class Enemy') && 
                    content.includes('update') &&
                    content.includes('takeDamage')) {
                    setStatus('test-enemy', 'pass');
                    log('敌人AI系统验证通过', 'success');
                } else {
                    setStatus('test-enemy', 'fail');
                    log('敌人AI系统不完整', 'error');
                }
                
                // 测试战斗系统
                if (content.includes('checkAttackHit') && 
                    content.includes('combo') &&
                    content.includes('stamina')) {
                    setStatus('test-combat', 'pass');
                    log('战斗系统验证通过（包含连击和体力）', 'success');
                } else {
                    setStatus('test-combat', 'fail');
                    log('战斗系统不完整', 'error');
                }
                
                // 测试技能系统
                if (content.includes('performSkill') && 
                    content.includes('createSkillEffect')) {
                    setStatus('test-skill', 'pass');
                    log('技能系统验证通过', 'success');
                } else {
                    setStatus('test-skill', 'fail');
                    log('技能系统不完整', 'error');
                }
                
            } catch (e) {
                log(`游戏系统测试失败: ${e.message}`, 'error');
            }
        }
        
        async function testRendering() {
            log('开始渲染系统测试...', 'info');
            
            try {
                const response = await fetch('/game.js');
                const content = await response.text();
                
                // 测试场景创建
                if (content.includes('createEnvironment') && 
                    content.includes('THREE.Scene')) {
                    setStatus('test-scene', 'pass');
                    log('3D场景系统验证通过', 'success');
                } else {
                    setStatus('test-scene', 'fail');
                    log('3D场景系统不完整', 'error');
                }
                
                // 测试光照
                if (content.includes('setupLights') && 
                    content.includes('DirectionalLight') &&
                    content.includes('shadow')) {
                    setStatus('test-lighting', 'pass');
                    log('光照系统验证通过（包含阴影）', 'success');
                } else {
                    setStatus('test-lighting', 'fail');
                    log('光照系统不完整', 'error');
                }
                
                // 测试粒子
                if (content.includes('createParticles') && 
                    content.includes('Points')) {
                    setStatus('test-particles', 'pass');
                    log('粒子特效系统验证通过', 'success');
                } else {
                    setStatus('test-particles', 'fail');
                    log('粒子特效系统不完整', 'error');
                }
                
            } catch (e) {
                log(`渲染系统测试失败: ${e.message}`, 'error');
            }
        }
        
        async function runAllTests() {
            log('========== 开始完整测试 ==========', 'info');
            await testFileLoading();
            await testGameSystems();
            await testRendering();
            log('========== 测试完成 ==========', 'info');
            
            // 统计结果
            const passCount = document.querySelectorAll('.status-pass').length;
            const failCount = document.querySelectorAll('.status-fail').length;
            const total = passCount + failCount;
            
            log(`测试结果: ${passCount}/${total} 通过`, 
                failCount === 0 ? 'success' : 'error');
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 500);
        });
    </script>
</body>
</html>
